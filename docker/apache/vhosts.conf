<VirtualHost *:80>
    ServerName localhost
    ServerAlias betweentables.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/betweentables-error.log
    CustomLog ${APACHE_LOG_DIR}/betweentables-access.log combined
</VirtualHost>

